<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4b1c2d">
  <meta name="description" content="Undangan digital — ULIDO Cetak">
  <title>Undangan Digital | ULIDO Cetak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="welcome" id="welcome" aria-label="Halaman pembuka undangan">
    <div class="welcome__frame">
      <div class="welcome__content">
        <p class="eyebrow" id="coverLabel">UNDANGAN SPESIAL</p>
        <div class="cover-icon" id="coverIcon" aria-hidden="true">♥</div>
        <h1 id="couple">Charles &amp; Eva</h1>
        <div class="recipient">
          <span id="guestLabel">Kepada Yth.</span>
          <div id="guestName" class="guest-name">Bapak/Ibu/Saudara/i</div>
        </div>
        <button id="openBtn" class="open-button" type="button">Buka Undangan <span aria-hidden="true">❯</span></button>
        <p class="hint">Musik dapat diputar setelah undangan dibuka.</p>
      </div>
    </div>
  </section>
  <main id="invitation" class="invitation" hidden>
    <div id="pages" class="pages" aria-label="Isi undangan"></div>
    <div class="end-panel">
      <p>Terima kasih atas doa dan restunya</p>
      <strong id="endCouple">Charles &amp; Pasangan</strong>
      <div class="quick-links">
  <a id="mapsPemberkatan" target="_blank"
     rel="noopener noreferrer" hidden>
    Lokasi Pemberkatan
  </a>

  <a id="mapsResepsi" target="_blank"
     rel="noopener noreferrer" hidden>
    Lokasi Resepsi dan Pesta Adat
  </a>

  <a id="waLink" target="_blank"
     rel="noopener noreferrer" hidden>
    Konfirmasi via WhatsApp
  </a>
</div>
      <small>Made with ♡ by ULIDO Cetak</small>
    </div>
  </main>
  <div class="floating-actions" id="floatingActions" hidden>
    <button id="musicBtn" type="button" aria-label="Putar atau hentikan musik" aria-pressed="false" title="Musik">♫</button>
    <button id="topBtn" type="button" aria-label="Kembali ke atas" title="Kembali ke atas">↑</button>
  </div>
  <audio id="backgroundAudio" preload="none" loop></audio>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
